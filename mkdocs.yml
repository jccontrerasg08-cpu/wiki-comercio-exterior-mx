site_name: Wiki Comercio Exterior MX
site_description: Conocimiento temporal y verificable de comercio exterior mexicano.
site_url: https://jccontrerasg08-cpu.github.io/wiki-comercio-exterior-mx/
repo_url: https://github.com/jccontrerasg08-cpu/wiki-comercio-exterior-mx
repo_name: wiki-comercio-exterior-mx
docs_dir: docs
exclude_docs: |
  superpowers/
watch:
  - includes
theme:
  name: material
  language: es
  font: false
  icon:
    logo: material/earth
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - search.suggest
    - search.highlight
    - search.share
plugins:
  search: {}
  meta: {}
  tags:
    tags_hierarchy: true
    tags_allowed:
      - Tema/Fundamentos
      - Tema/Aduana
      - Tema/Clasificación
      - Tema/RRNA
      - Tema/Contribuciones
      - Tema/Programas
      - Tema/Logística
      - Tipo/Fuente
      - Tipo/Metodología
      - Tipo/Estado
  redirects:
    redirect_maps:
      aduana/anam.md: wiki/aduana/anam.md
      aduana/cambios-2026.md: wiki/aduana/cambios-2026.md
      aduana/documentos.md: wiki/aduana/documentos.md
      aduana/pedimento-rgce.md: wiki/aduana/pedimento-rgce.md
      aduana/regimenes-aduaneros.md: wiki/aduana/regimenes-aduaneros.md
      clasificacion/rrna.md: wiki/clasificacion/rrna.md
      clasificacion/sistema-armonizado.md: wiki/clasificacion/sistema-armonizado.md
      clasificacion/tigie-nico.md: wiki/clasificacion/tigie-nico.md
      contribuciones/aranceles.md: wiki/contribuciones/aranceles.md
      contribuciones/cuotas-compensatorias.md: wiki/contribuciones/cuotas-compensatorias.md
      contribuciones/impuestos-importacion.md: wiki/contribuciones/impuestos-importacion.md
      contribuciones/valor-en-aduana.md: wiki/contribuciones/valor-en-aduana.md
      fundamentos/marco-juridico.md: wiki/fundamentos/marco-juridico.md
      fundamentos/padron-importadores.md: wiki/fundamentos/padron-importadores.md
      logistica/incoterms.md: wiki/logistica/incoterms.md
      logistica/logistica-internacional.md: wiki/logistica/logistica-internacional.md
      logistica/pagos-internacionales.md: wiki/logistica/pagos-internacionales.md
      programas/drawback.md: wiki/programas/drawback.md
      programas/immex.md: wiki/programas/immex.md
      programas/prosec.md: wiki/programas/prosec.md
      programas/reglas-de-origen.md: wiki/programas/reglas-de-origen.md
      programas/tlc-tmec.md: wiki/programas/tlc-tmec.md
      rrna/anexo-2-2-1.md: wiki/rrna/anexo-2-2-1.md
      rrna/anexo-2-4-1.md: wiki/rrna/anexo-2-4-1.md
      rrna/index.md: wiki/rrna/index.md
      rrna/reglas-criterios-se.md: wiki/rrna/reglas-criterios-se.md
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - assets/javascripts/anam-dashboard.js
  - assets/javascripts/world-explorer.js
nav:
