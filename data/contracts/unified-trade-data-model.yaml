model_version: "1.0"
purpose: >-
  Modelo canónico de observaciones para conectar recaudación administrativa ANAM,
  aranceles y flujos internacionales sin tratarlos como una misma variable.
controlled_vocabularies:
  domain:
    - revenue_anam
    - tariff
    - trade_flow
  observation_status:
    - published
    - provisional
    - revised
    - schema_fixture
  tariff_rate_type:
    - bound
    - mfn_applied
    - preferential
    - specific
    - compound
logical_key:
  - domain
  - source_dataset_id
  - source_release_or_vintage
  - observation_period
  - reporter_iso3
  - partner_iso3
  - classification_system
  - classification_version
  - classification_code
  - measure_id
  - customs_regime_or_preference
cross_repo_boundaries:
  wiki_comercio_exterior_mx: "Fuentes, instrumentos, evidencia, metadatos, contratos y vistas editoriales."
  arancel_mx: "LIGIE, TIGIE, fracción, NICO y lógica arancelaria mexicana estructurada."
  dof_diff_lab: "Detección de cambios documentales; requiere revisión humana antes de declarar una consecuencia normativa."
  aduanamap_mx: "Geometrías y relaciones geoespaciales canónicas."
  geometry_mode: contract-only
  dashboard_mode: read-only-progressive-enhancement
modules:
  source_registry:
    responsibility: "Identidad de fuente, autoridad, URL, licencia, hash, consulta y publicación."
    owner: wiki-comercio-exterior-mx
  observation_contract:
    responsibility: "Valida dimensiones, medidas, periodo, unidad y exclusión de dominios incompatibles."
    owner: wiki-comercio-exterior-mx
  tariff_adapter:
    responsibility: "Publica versión, hash e identificadores desde arancel-mx; no duplica su lógica."
    owner: arancel-mx
  legal_change_adapter:
    responsibility: "Publica evento detectado, evidencia y estado de revisión; no declara vigencia automática."
    owner: dof-diff-lab
  geographic_adapter:
    responsibility: "Consume artefacto geoespacial público, inmutable y verificable cuando exista."
    owner: aduanamap-mx
  dashboard_view:
    responsibility: "Lee observaciones ya validadas y conserva tabla y fuente como ruta primaria."
    owner: wiki-comercio-exterior-mx
prioritization:
  micro:
    objective: "Calidad de cada observación y de cada fuente."
    deliverables:
      - "Fuente, URL, hash cuando exista, fecha de consulta, release/vintage y nota metodológica."
      - "Periodo, unidad, moneda, frecuencia, dominio, medida y estado de granularidad obligatorios."
      - "Tablas Markdown accesibles y filtros locales sobre datos publicados."
  meso:
    objective: "Relaciones gobernadas entre instrumentos, operación, producto, socio y fuente."
    deliverables:
      - "Identificadores ISO3, HS6 y versión de clasificación."
      - "Adaptadores versionados para arancel-mx y dof-diff-lab."
      - "Catálogo de indicadores que prohíba mezclar recaudación, aranceles y flujos."
  macro:
    objective: "Exploración México-mundo reproducible y escalable."
    deliverables:
      - "Indicadores internacionales con metadata completa y tabla equivalente."
      - "Mapa opcional sobre la misma tabla, sólo tras artefacto geoespacial verificable."
      - "PMTiles o carga diferida sólo cuando la evidencia y volumen justifiquen la complejidad."
