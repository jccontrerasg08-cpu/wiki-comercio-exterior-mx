version: 2

updates:
  # Python / MkDocs documentation dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep Action updates in one reviewable PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github_actions"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
