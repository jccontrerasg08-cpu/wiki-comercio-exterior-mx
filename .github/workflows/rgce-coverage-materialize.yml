name: rgce-coverage-materialize

on:
  push:
    branches:
      - feat/rgce-2026-annex-review

permissions:
  contents: write

concurrency:
  group: rgce-coverage-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[rgce-coverage-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/rgce-2026-annex-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Regenerate coverage snapshots
        run: python -m scripts.coverage_report
      - name: Commit only generated coverage snapshots
        run: |
          if git diff --quiet -- docs/status/corpus-coverage.md reports/corpus-coverage.json; then
            echo "No coverage changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/status/corpus-coverage.md reports/corpus-coverage.json
          git commit -m "chore: regenerate RGCE coverage snapshots [rgce-coverage-materialized]"
          git push origin HEAD:feat/rgce-2026-annex-review
