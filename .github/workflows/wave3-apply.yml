name: wave3-apply

on:
  push:
    branches:
      - feat/immex-anexos-24-30
    paths:
      - scripts/_wave3_apply.py
      - .github/workflows/wave3-apply.yml

permissions:
  contents: write

concurrency:
  group: wave3-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/immex-anexos-24-30
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Verify current official Annex 24 and 30 evidence
        shell: python
        run: |
          import html
          import re
          import unicodedata
          import requests

          def plain(value: str) -> str:
              value = html.unescape(value)
              value = re.sub(r"<[^>]+>", " ", value)
              value = unicodedata.normalize("NFKD", value)
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              return re.sub(r"\s+", " ", value).casefold()

          annex_url = "https://sidof.segob.gob.mx/notas/docFuente/5778300"
          response = requests.get(annex_url, timeout=30)
          response.raise_for_status()
          text = plain(response.text)

          a24_start = text.index("anexo 24 de las reglas generales de comercio exterior para 2026")
          a25_start = text.index("anexo 25 de las reglas generales de comercio exterior para 2026")
          a24 = text[a24_start:a25_start]
          for marker in ("seciit", "24 horas", "48 horas", "primeras entradas primeras salidas"):
              assert marker in a24, f"Annex 24 current-text marker missing: {marker}"

          a30_start = text.index("anexo 30 de las reglas generales de comercio exterior para 2026")
          a30 = text[a30_start:]
          for marker in ("scccyg", "presuntiva", "peps", "resolucion definitiva"):
              assert marker in a30, f"Annex 30 current-text marker missing: {marker}"

          sat_url = "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html"
          sat = requests.get(sat_url, timeout=30)
          sat.raise_for_status()
          sat_text = plain(sat.text)
          assert "anexo 24 de las rgce 2026" in sat_text
          assert "anexo 30 de las rgce 2026" in sat_text
          assert "modificacion anexo 24 de las rgce 2026" not in sat_text
          assert "modificacion anexo 30 de las rgce 2026" not in sat_text
          print("Official 2026 Annex 24/30 preflight verified")

      - name: Apply Wave 3 production edits
        run: python scripts/_wave3_apply.py

      - name: Regenerate official-source catalog
        run: python -m scripts.build_catalog

      - name: Regenerate corpus coverage outputs
        run: python -m scripts.coverage_report

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository integrity
        run: python -m scripts.validate_repository

      - name: Check generated catalog
        run: python -m scripts.build_catalog --check

      - name: Check page provenance inventory
        run: python -m scripts.page_metadata --check

      - name: Check corpus coverage dashboard
        run: python -m scripts.coverage_report --check

      - name: Check temporal instrument graph
        run: python -m scripts.temporal_graph --check

      - name: Evaluate temporal retrieval
        run: python -m scripts.rag_eval --check

      - name: Build MkDocs in strict mode
        run: python -m mkdocs build --strict

      - name: Verify legacy public routes
        run: python -m scripts.verify_site site

      - name: Remove one-shot migration infrastructure
        run: git rm scripts/_wave3_apply.py .github/workflows/wave3-apply.yml

      - name: Commit verified Wave 3 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: build IMMEX and Annex 24/30 knowledge path"
          git push origin HEAD:feat/immex-anexos-24-30
