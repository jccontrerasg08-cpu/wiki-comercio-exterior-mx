name: rgce-materialize

on:
  push:
    branches:
      - feat/rgce-2026-annex-review

permissions:
  contents: write

concurrency:
  group: rgce-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[rgce-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/rgce-2026-annex-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Materialize scoped files
        run: python -m scripts.rgce_annexes --materialize
      - name: Commit only materialized metadata
        run: |
          if git diff --quiet -- sources/instruments.yaml sources/page_metadata.yaml; then
            echo "No materialized changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sources/instruments.yaml sources/page_metadata.yaml
          git commit -m "chore: materialize RGCE annex metadata [rgce-materialized]"
          git push origin HEAD:feat/rgce-2026-annex-review
