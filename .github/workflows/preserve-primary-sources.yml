name: preserve-primary-sources-capture

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/capture_primary_originals.py
      - .github/workflows/preserve-primary-sources.yml

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.actor == 'jccontrerasg08-cpu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/preserve-missing-primary-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Capture missing primary originals
        run: python -m scripts.capture_primary_originals --output data/originals/primary-2026-08-16

      - name: Register local manifest fragment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/originals/manifest.yaml")
          entry = "- primary-2026-08-16/MANIFEST.yaml"
          text = path.read_text(encoding="utf-8")
          if entry not in text.splitlines():
              if not text.endswith("\n"):
                  text += "\n"
              text += entry + "\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate archive surfaces
        run: |
          python -m scripts.archive_audit
          python -m scripts.build_catalog
          python -m scripts.build_knowledge_map

      - name: Verify captured bytes and generated state
        run: |
          python -m scripts.validate_repository
          python -m scripts.archive_audit --check
          python -m scripts.build_catalog --check
          python -m scripts.build_knowledge_map --check

      - name: Summarize captured bytes
        run: |
          find data/originals/primary-2026-08-16 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          find data/originals/primary-2026-08-16 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Upload capture artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: primary-source-capture
          path: data/originals/primary-2026-08-16/
          if-no-files-found: error
          retention-days: 1

      - name: Commit exact verified capture and remove temporary workflow
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preserve-primary-sources.yml
          git add data/originals/manifest.yaml data/originals/primary-2026-08-16
          git add docs/status/missing-primary-sources.md docs/catalog
          git add docs/explore/knowledge-map.md docs/assets/data/knowledge-index.json
          git diff --cached --check
          git commit -m "data: preserve active primary originals"
          git push origin "HEAD:${TARGET_BRANCH}"
