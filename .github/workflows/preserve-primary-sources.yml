name: preserve-primary-sources-capture

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/capture_primary_originals.py
      - .github/workflows/preserve-primary-sources.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Capture missing primary originals
        run: python -m scripts.capture_primary_originals --output data/originals/primary-2026-08-16

      - name: Summarize captured bytes
        if: always()
        run: |
          find data/originals/primary-2026-08-16 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          find data/originals/primary-2026-08-16 -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: primary-source-capture
          path: data/originals/primary-2026-08-16/
          if-no-files-found: error
          retention-days: 1
