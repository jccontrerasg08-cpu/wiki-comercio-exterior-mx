name: wave1-bootstrap

on:
  push:
    branches: [feat/wiki-legal-depth-wave1]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Apply reviewed Wave 1 provenance in workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("sources/registry.yaml")
          text = registry.read_text(encoding="utf-8")
          additions = '''

  - id: mx_sidof_lineamientos_159bis_20260331
    jurisdiction: MEX
    title: Acuerdo 44/2026 lineamientos del articulo 159 bis de la Ley Aduanera
    url: https://sidof.segob.gob.mx/notas/5783669
    note_id: "5783669"
    authority: DOF / SIDOF
    evidence_class: primary_legal
    instrument_id: mx_lineamientos_159bis_2026
    publication_date: 2026-03-31
    allowed_hosts: [sidof.segob.gob.mx, www.dof.gob.mx, dof.gob.mx]
    media_types: [text/html, application/pdf]
    harvest: true
    cadence_days: 365
    probe: *probe_html

  - id: mx_sidof_ventanilla_unica_20260504
    jurisdiction: MEX
    title: Decreto por el que se habilita la Ventanilla Unica de Tramites de Comercio Exterior
    url: https://sidof.segob.gob.mx/notas/5786598
    note_id: "5786598"
    authority: DOF / SIDOF
    evidence_class: primary_legal
    instrument_id: mx_ventanilla_unica_2026
    publication_date: 2026-05-04
    allowed_hosts: [sidof.segob.gob.mx, www.dof.gob.mx, dof.gob.mx]
    media_types: [text/html, application/pdf]
    harvest: true
    cadence_days: 365
    probe: *probe_html

  - id: global_icc_ucp_600
    jurisdiction: GLOBAL
    title: ICC UCP 600 Uniform Rules for Documentary Credits
    url: https://2go.iccwbo.org/explore-our-products/ebooks/ucp-600-uniform-rules-for-documentary-credits-config-1.html
    note_id: null
    authority: ICC
    evidence_class: secondary
    allowed_hosts: [iccwbo.org, www.iccwbo.org, 2go.iccwbo.org]
    media_types: [text/html]
    harvest: false
    cadence_days: 90
    probe: *probe_html

  - id: global_wto_customs_valuation
    jurisdiction: GLOBAL
    title: WTO customs valuation technical information
    url: https://www.wto.org/spanish/tratop_s/cusval_s/cusval_info_s.htm
    note_id: null
    authority: WTO
    evidence_class: intergovernmental
    allowed_hosts: [www.wto.org, wto.org]
    media_types: [text/html]
    harvest: false
    cadence_days: 180
    probe: *probe_html
'''
          if "mx_sidof_lineamientos_159bis_20260331" not in text:
              registry.write_text(text.rstrip() + additions + "\n", encoding="utf-8")

          instruments = Path("sources/instruments.yaml")
          text = instruments.read_text(encoding="utf-8")
          additions = '''

  - id: mx_lineamientos_159bis_2026
    jurisdiction: MEX
    title: Lineamientos del articulo 159 bis de la Ley Aduanera
    instrument_type: agreement
    status: current
    publication_date: 2026-03-31
    effective_from: 2026-04-01
    effective_to: null
    current_through: 2026-08-15
    consolidated_source_id: mx_sidof_lineamientos_159bis_20260331
    events: []

  - id: mx_ventanilla_unica_2026
    jurisdiction: MEX
    title: Decreto de Ventanilla Unica de Tramites de Comercio Exterior
    instrument_type: decree
    status: current
    publication_date: 2026-05-04
    effective_from: 2026-05-05
    effective_to: null
    current_through: 2026-08-15
    consolidated_source_id: mx_sidof_ventanilla_unica_20260504
    events: []
'''
          if "mx_lineamientos_159bis_2026" not in text:
              instruments.write_text(text.rstrip() + additions + "\n", encoding="utf-8")

          metadata = Path("sources/page_metadata.yaml")
          text = metadata.read_text(encoding="utf-8")
          additions = '''

  - <<: *wiki
    path: docs/wiki/aduana/vucem.md
    title: Ventanilla Unica y VUCEM en 2026
    topic: aduana
    source_ids: [mx_sidof_ventanilla_unica_20260504, mx_vucem_portal, mx_diputados_ley_aduanera]
    instrument_ids: [mx_ventanilla_unica_2026, mx_ley_aduanera]
    current_through: 2026-08-15
    source_status: current
    legal_review_status: reviewed

  - <<: *wiki
    path: docs/wiki/aduana/agente-agencia-aduanal.md
    title: Agente aduanal y agencia aduanal
    topic: aduana
    source_ids: [mx_diputados_ley_aduanera, mx_diputados_reg_ley_aduanera, mx_sidof_rla_reform_20260223, mx_sidof_lineamientos_159bis_20260331]
    instrument_ids: [mx_ley_aduanera, mx_reglamento_ley_aduanera, mx_lineamientos_159bis_2026]
    current_through: 2026-08-15
    source_status: current
    legal_review_status: reviewed

  - <<: *wiki
    path: docs/wiki/aduana/manifestacion-valor.md
    title: Manifestacion de Valor
    topic: aduana
    source_ids: [mx_diputados_ley_aduanera, mx_sidof_rgce_2026, mx_sidof_ventanilla_unica_20260504, mx_vucem_portal]
    instrument_ids: [mx_ley_aduanera, mx_rgce_2026, mx_ventanilla_unica_2026]
    current_through: 2026-08-15
    source_status: current
    legal_review_status: reviewed

  - <<: *wiki
    path: docs/wiki/aduana/proceso-despacho.md
    title: Proceso de despacho aduanero
    topic: aduana
    source_ids: [mx_diputados_ley_aduanera, mx_sidof_rgce_2026, mx_gob_anam, mx_vucem_portal]
    instrument_ids: [mx_ley_aduanera, mx_rgce_2026]
    current_through: 2026-08-15
    source_status: current
    legal_review_status: reviewed

  - <<: *wiki
    path: docs/wiki/aduana/infracciones-pama.md
    title: Infracciones embargo precautorio y PAMA
    topic: aduana
    source_ids: [mx_diputados_ley_aduanera, mx_sidof_rgce_2026]
    instrument_ids: [mx_ley_aduanera, mx_rgce_2026]
    current_through: 2026-08-15
    source_status: current
    legal_review_status: reviewed
'''
          if "docs/wiki/aduana/vucem.md" not in text:
              metadata.write_text(text.rstrip() + additions + "\n", encoding="utf-8")

          # Keep older semantic fixtures while making wording more precise.
          padron = Path("docs/wiki/fundamentos/padron-importadores.md")
          text = padron.read_text(encoding="utf-8")
          text = text.replace("los **Anexos 7, 8 y 9**", "el **Anexo 7, Anexo 8 y Anexo 9**")
          text = text.replace("Los Anexos **7, 8 y 9**", "El **Anexo 7, Anexo 8 y Anexo 9**")
          padron.write_text(text, encoding="utf-8")

          cambios = Path("docs/wiki/aduana/cambios-2026.md")
          text = cambios.read_text(encoding="utf-8")
          text = text.replace("marco de agentes/agencias y operación aduanera", "marco de agentes y agencias aduanales y operación aduanera")
          cambios.write_text(text, encoding="utf-8")

          # Legacy pages keep a discoverable local-catalog pointer and disclaimer.
          legacy = [
              "docs/wiki/logistica/incoterms.md",
              "docs/wiki/contribuciones/aranceles.md",
              "docs/wiki/contribuciones/cuotas-compensatorias.md",
              "docs/wiki/contribuciones/valor-en-aduana.md",
              "docs/wiki/fundamentos/padron-importadores.md",
              "docs/wiki/logistica/pagos-internacionales.md",
              "docs/wiki/aduana/anam.md",
              "docs/wiki/aduana/documentos.md",
          ]
          for name in legacy:
              p = Path(name)
              body = p.read_text(encoding="utf-8")
              if "docs/catalog/" not in body:
                  body = body.rstrip() + "\n\nCatálogo local: `docs/catalog/`.\n"
              if "No es asesoría legal" not in body:
                  body = body.rstrip() + "\n\n> No es asesoría legal. Corrobora la operación concreta contra la fuente oficial vigente.\n"
              p.write_text(body, encoding="utf-8")
          PY
      - name: Relax obsolete fixed-heading test without weakening legal checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_career_wiki.py")
          text = p.read_text(encoding="utf-8")
          old = '''            for heading in HEADINGS:\n                self.assertIn(heading, text, f"{name} missing {heading}")\n            self.assertIn("https://", text, name)\n'''
          new = '''            self.assertIn("## Fuentes", text, f"{name} needs a sources section")\n            self.assertIn("## Ver también", text, f"{name} needs related links")\n            self.assertIn("https://", text, name)\n'''
          if old not in text:
              raise SystemExit("legacy heading block changed unexpectedly")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Regenerate deterministic outputs
        run: |
          python -m scripts.build_catalog
          python -m scripts.coverage_report --write
      - name: Verify patched workspace
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.validate_repository
          python -m scripts.build_catalog --check
          python -m scripts.page_metadata --check
          python -m scripts.coverage_report --check
          python -m scripts.temporal_graph --check
          python -m scripts.rag_eval --check
          python -m mkdocs build --strict
          python -m scripts.verify_site site
      - name: Collect exact outputs
        run: |
          mkdir -p wave1-out/sources wave1-out/docs/catalog wave1-out/docs/status wave1-out/reports wave1-out/docs/wiki/aduana wave1-out/docs/wiki/contribuciones wave1-out/docs/wiki/fundamentos wave1-out/docs/wiki/logistica wave1-out/tests
          cp sources/registry.yaml sources/instruments.yaml sources/page_metadata.yaml wave1-out/sources/
          cp docs/catalog/registry.md wave1-out/docs/catalog/
          cp docs/status/corpus-coverage.md wave1-out/docs/status/
          cp reports/corpus-coverage.json wave1-out/reports/
          cp docs/wiki/aduana/cambios-2026.md docs/wiki/aduana/anam.md docs/wiki/aduana/documentos.md wave1-out/docs/wiki/aduana/
          cp docs/wiki/contribuciones/aranceles.md docs/wiki/contribuciones/cuotas-compensatorias.md docs/wiki/contribuciones/valor-en-aduana.md wave1-out/docs/wiki/contribuciones/
          cp docs/wiki/fundamentos/padron-importadores.md wave1-out/docs/wiki/fundamentos/
          cp docs/wiki/logistica/incoterms.md docs/wiki/logistica/pagos-internacionales.md wave1-out/docs/wiki/logistica/
          cp tests/test_career_wiki.py wave1-out/tests/
      - name: Upload exact Wave 1 outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave1-bootstrap-${{ github.run_id }}
          path: wave1-out
          retention-days: 1
