name: official-source-health

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-source-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Restore observation state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .source-health-state.yaml
          key: source-health-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-health-state-
      - name: Run due bounded probes
        id: probe
        continue-on-error: true
        run: >-
          python -m scripts.source_health
          --mode due
          --limit 20
          --state .source-health-state.yaml
          --state-output .source-health-state.yaml
          --output source-health.json
      - name: Save observation state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .source-health-state.yaml
          key: source-health-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Discover new SIDOF candidates
        id: watch
        continue-on-error: true
        run: |
          python -m scripts.legal_watch --date "$(TZ=America/Mexico_City date +%F)" --lookback-days 4 --output legal-watch.json
          count="$(python -c 'import json; print(len(json.load(open("legal-watch.json", encoding="utf-8"))))')"
          echo "candidates=$count" >> "$GITHUB_OUTPUT"
      - name: Discover SNICE document intelligence
        id: snice
        continue-on-error: true
        run: >-
          python -m scripts.snice_discovery
          --output-dir snice-intelligence
      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-source-health-${{ github.run_id }}
          path: |
            source-health.json
            legal-watch.json
            snice-intelligence/*.json
            .source-health-state.yaml
          retention-days: 14
          if-no-files-found: warn
      - name: Open or update one review issue
        if: steps.probe.outcome == 'failure' || steps.watch.outcome == 'failure' || steps.snice.outcome == 'failure' || steps.watch.outputs.candidates != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_COUNT: ${{ steps.watch.outputs.candidates }}
          SNICE_OUTCOME: ${{ steps.snice.outcome }}
        with:
          script: |
            const title = "[legal-monitor] Official source review required";
            const snice = process.env.SNICE_OUTCOME === "failure" ? " SNICE document discovery also failed." : "";
            const body = `The bounded monitor found a transport problem, a discovery problem, or ${process.env.CANDIDATE_COUNT || "new"} SIDOF candidate(s).${snice} Review run ${context.runId}. Do not change legal status from this result alone.`;
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
      - name: Preserve technical failure status
        if: steps.probe.outcome == 'failure' || steps.watch.outcome == 'failure' || steps.snice.outcome == 'failure'
        run: exit 1
