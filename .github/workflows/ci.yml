name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-ci:
    name: repository-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Generate knowledge map for drift detection
        run: python -m scripts.build_knowledge_map

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Check committed knowledge map
        run: git diff --exit-code -- docs/explore/knowledge-map.md docs/assets/data/knowledge-index.json

      - name: Validate repository integrity
        run: python -m scripts.validate_repository

      - name: Validate cross-repo data contracts
        run: python -m scripts.validate_data_contracts

      - name: Check primary-source archive audit
        run: python -m scripts.archive_audit --check

      - name: Check generated catalog
        run: python -m scripts.build_catalog --check

      - name: Check page provenance inventory
        run: python -m scripts.page_metadata --check

      - name: Check corpus coverage dashboard
        run: python -m scripts.coverage_report --check

      - name: Check generated knowledge map
        run: python -m scripts.build_knowledge_map --check

      - name: Check temporal instrument graph
        run: python -m scripts.temporal_graph --check

      - name: Evaluate temporal retrieval
        run: python -m scripts.rag_eval --check

      - name: Build MkDocs in strict mode
        run: python -m mkdocs build --strict

      - name: Verify legacy public routes
        run: python -m scripts.verify_site site

      - name: Build offline documentation
        run: python -m mkdocs build --strict -f mkdocs.offline.yml -d site-offline

      - name: Verify offline documentation
        run: python -m scripts.verify_offline_site site-offline
