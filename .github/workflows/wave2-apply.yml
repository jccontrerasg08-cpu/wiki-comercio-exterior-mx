name: wave2-apply

on:
  push:
    branches:
      - feat/wiki-editorial-seo-wave2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/wiki-editorial-seo-wave2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Apply editorial migration
        run: python scripts/_wave2_migrate.py

      - name: Remove temporary migration infrastructure
        run: |
          git rm -f scripts/_wave2_migrate.py
          git rm -f .github/workflows/wave2-apply.yml

      - name: Verify migrated branch
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.validate_repository
          python -m scripts.build_catalog --check
          python -m scripts.page_metadata --check
          python -m scripts.coverage_report --check
          python -m scripts.temporal_graph --check
          python -m scripts.rag_eval --check
          python -m mkdocs build --strict
          python -m scripts.verify_site site

      - name: Commit verified editorial migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tests scripts/verify_site.py mkdocs.yml
          git status --short
          git diff --cached --check
          git commit -m "docs: enforce editorial and SEO quality"
          git push origin HEAD:feat/wiki-editorial-seo-wave2
