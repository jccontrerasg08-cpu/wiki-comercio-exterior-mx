name: wave1-apply

on:
  push:
    branches:
      - feat/wiki-legal-depth-wave1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/wiki-legal-depth-wave1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Materialize verified provenance and generated outputs
        run: |
          sed -i 's/, "--write"//' scripts/_wave1_bootstrap.py
          python scripts/_wave1_bootstrap.py

      - name: Enrich affected page provenance and ratchet coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          p = Path("sources/page_metadata.yaml")
          text = p.read_text(encoding="utf-8")
          replacements = {
              """    path: docs/wiki/aduana/anam.md\n    title: Agencia Nacional de Aduanas de Mexico\n    topic: aduana\n    source_ids: [mx_gob_anam]\n""": """    path: docs/wiki/aduana/anam.md\n    title: Agencia Nacional de Aduanas de Mexico\n    topic: aduana\n    source_ids: [mx_gob_anam, mx_diputados_ley_aduanera, mx_sidof_ventanilla_unica_20260504]\n    instrument_ids: [mx_ley_aduanera, mx_ventanilla_unica_2026]\n""",
              """    path: docs/wiki/aduana/documentos.md\n    title: Documentos para el despacho aduanero\n    topic: aduana\n    source_ids: [mx_diputados_ley_aduanera]\n    instrument_ids: [mx_ley_aduanera]\n""": """    path: docs/wiki/aduana/documentos.md\n    title: Documentos para el despacho aduanero\n    topic: aduana\n    source_ids: [mx_diputados_ley_aduanera, mx_sidof_rgce_2026, mx_sidof_ventanilla_unica_20260504]\n    instrument_ids: [mx_ley_aduanera, mx_rgce_2026, mx_ventanilla_unica_2026]\n""",
              """    path: docs/wiki/contribuciones/aranceles.md\n    title: Aranceles\n    topic: contribuciones\n    source_ids: [mx_diputados_ligie_current]\n    instrument_ids: [mx_ligie]\n""": """    path: docs/wiki/contribuciones/aranceles.md\n    title: Aranceles\n    topic: contribuciones\n    source_ids: [mx_diputados_ligie_current, mx_sidof_ligie_prosec_20260423]\n    instrument_ids: [mx_ligie]\n""",
              """    path: docs/wiki/contribuciones/valor-en-aduana.md\n    title: Valor en aduana\n    topic: contribuciones\n    source_ids: [mx_diputados_ley_aduanera]\n    instrument_ids: [mx_ley_aduanera]\n""": """    path: docs/wiki/contribuciones/valor-en-aduana.md\n    title: Valor en aduana\n    topic: contribuciones\n    source_ids: [mx_diputados_ley_aduanera, global_wto_customs_valuation]\n    instrument_ids: [mx_ley_aduanera]\n""",
              """    path: docs/wiki/logistica/pagos-internacionales.md\n    title: Pagos internacionales\n    topic: logistica\n""": """    path: docs/wiki/logistica/pagos-internacionales.md\n    title: Pagos internacionales\n    topic: logistica\n    source_ids: [global_icc_ucp_600]\n""",
              """    path: docs/wiki/aduana/cambios-2026.md\n    title: Cambios relevantes de 2026\n    topic: aduana\n    source_ids: [mx_sidof_rla_reform_20260223, mx_sidof_lce_reform_20260501, mx_sidof_rgce_2026_mod1, mx_sidof_reglas_se_mod_20260529]\n    instrument_ids: [mx_reglamento_ley_aduanera, mx_ley_comercio_exterior, mx_rgce_2026, mx_reglas_criterios_se]\n""": """    path: docs/wiki/aduana/cambios-2026.md\n    title: Cambios relevantes de 2026\n    topic: aduana\n    source_ids: [mx_sidof_rla_reform_20260223, mx_sidof_lineamientos_159bis_20260331, mx_sidof_ligie_prosec_20260423, mx_sidof_lce_reform_20260501, mx_sidof_ventanilla_unica_20260504, mx_sidof_rgce_2026_mod1, mx_sidof_reglas_se_mod_20260529]\n    instrument_ids: [mx_reglamento_ley_aduanera, mx_lineamientos_159bis_2026, mx_ligie, mx_programa_prosec, mx_ley_comercio_exterior, mx_ventanilla_unica_2026, mx_rgce_2026, mx_reglas_criterios_se]\n""",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"metadata block changed unexpectedly: {old.splitlines()[0:2]}")
              text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")

          import subprocess
          subprocess.run(["python", "-m", "scripts.build_catalog"], check=True)
          subprocess.run(["python", "-m", "scripts.coverage_report"], check=True)

          report = json.loads(Path("reports/corpus-coverage.json").read_text(encoding="utf-8"))
          s = report["summary"]
          policy_path = Path("coverage-policy.yaml")
          policy = yaml.safe_load(policy_path.read_text(encoding="utf-8"))
          floors = policy["floors"]
          floors["retrieval_eligible_pages"] = s["retrieval_eligible_pages"]
          floors["pages_with_sources"] = s["pages_with_sources"]
          floors["pages_with_instruments"] = s["pages_with_instruments"]
          floors["legally_reviewed_pages"] = s["legally_reviewed_pages"]
          ceilings = policy["ceilings"]
          ceilings["pending_legal_review_pages"] = s["pending_legal_review_pages"]
          ceilings["non_current_corpus_pages"] = s["non_current_corpus_pages"]
          ceilings["unknown_source_status_pages"] = s["unknown_source_status_pages"]
          policy_path.write_text(yaml.safe_dump(policy, sort_keys=False, allow_unicode=True), encoding="utf-8")
          PY

      - name: Remove temporary bootstrap infrastructure
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm scripts/_wave1_bootstrap.py
          git rm .github/workflows/wave1-apply.yml

      - name: Verify final branch state
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.validate_repository
          python -m scripts.build_catalog --check
          python -m scripts.page_metadata --check
          python -m scripts.coverage_report --check
          python -m scripts.temporal_graph --check
          python -m scripts.rag_eval --check
          python -m mkdocs build --strict
          python -m scripts.verify_site site

      - name: Commit final verified state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml coverage-policy.yaml
          git add sources/registry.yaml sources/instruments.yaml sources/page_metadata.yaml
          git add docs/catalog/registry.md docs/status/corpus-coverage.md reports/corpus-coverage.json
          git add docs/wiki/aduana/anam.md docs/wiki/aduana/cambios-2026.md docs/wiki/aduana/documentos.md
          git add docs/wiki/contribuciones/aranceles.md docs/wiki/contribuciones/cuotas-compensatorias.md docs/wiki/contribuciones/valor-en-aduana.md
          git add docs/wiki/fundamentos/padron-importadores.md docs/wiki/logistica/incoterms.md docs/wiki/logistica/pagos-internacionales.md
          git add tests/test_career_wiki.py
          git status --short
          git diff --cached --check
          git commit -m "docs: finalize wave1 legal provenance"
          git push origin HEAD:feat/wiki-legal-depth-wave1
