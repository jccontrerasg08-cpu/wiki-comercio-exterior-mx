  "^https://www\\.sat\\.gob\\.mx/",
  "^https://www\\.snice\\.gob\\.mx/cs/avi/snice/hce\\.mi\\.fraccion\\.arancelaria\\.html$",
  "^https://2go\\.iccwbo\\.org/",
  # Fallan por TLS/5xx/bloqueo propio del sitio, no por un enlace roto (comprobado en CI 2026-11-10).
  "^https://www\\.sice\\.oas\\.org/",
  "^https://www\\.snice\\.gob\\.mx/cs/avi/snice/drawback\\.html$",
  "^https://www\\.wcoomd\\.org/en/topics/nomenclature\\.aspx$",
  "^https://ec\\.europa\\.eu/eurostat/web/sdmx-infospace/",
  "^https://iccmex\\.mx/",
  # Repositorio privado: da 404 sin sesión.
  "^https://github\\.com/jccontrerasg08-cpu/aduanamap-mx$"
]
